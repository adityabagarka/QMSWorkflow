name: Deploy to Supabase staging

# Run by hand from the Actions tab. Not automatic on push: this writes to a real
# database, so it should be a deliberate act.
on:
  workflow_dispatch:
    inputs:
      import_guardrails:
        description: 'Also import the guardrails workbook'
        type: boolean
        default: true

jobs:
  deploy:
    name: Migrate, verify and seed
    runs-on: ubuntu-latest
    environment: staging

    env:
      # Set in GitHub under Settings -> Secrets and variables -> Actions.
      # Use the SESSION POOLER connection string from the Supabase dashboard:
      # the direct db.<ref>.supabase.co host is IPv6-only and GitHub's runners
      # are IPv4, so a direct string will simply time out here.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check the connection string is present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Prints the parsed connection details (never the password) and connects
      # through the same code path the migrations use. A bad secret fails here,
      # legibly, rather than as a parser error from inside a library.
      - name: Confirm the database is reachable
        run: npm run db:check

      - name: Apply migrations
        id: migrate
        run: npm run db:migrate

      # Read-only checks: migrations at head, RLS on every table holding case
      # data, a policy on each, the public wrappers the app calls, the audit
      # log's missing UPDATE/DELETE grants, the reference tables loaded, India
      # time on the app roles.
      #
      # Deliberately NOT the pgTAP suites. Those create fixtures, and a fixture
      # meeting a real row is what broke five deploys running — a test database
      # is where they belong, and CI runs all 223 assertions against a scratch
      # Postgres on every push.
      - name: Check the deployed database is sound
        id: verify
        run: npm run db:smoke

      - name: Import the guardrails workbook
        id: seed
        if: ${{ inputs.import_guardrails && !cancelled() }}
        run: npm run db:import-guardrails

      - name: Summarise
        if: always()
        env:
          MIGRATE: ${{ steps.migrate.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          SEED: ${{ steps.seed.outcome }}
        run: |
          echo "### Staging deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Say which stage did what. A failure after the migrations have
          # applied means the schema IS deployed and only the checks failed —
          # which reads identically to a total failure without this.
          mark() { [ "$1" = "success" ] && echo "applied" || { [ "$1" = "skipped" ] && echo "skipped" || echo "FAILED"; }; }
          echo "- Migrations: $(mark "$MIGRATE")" >> $GITHUB_STEP_SUMMARY
          echo "- Checks: $(mark "$VERIFY")" >> $GITHUB_STEP_SUMMARY
          echo "- Guardrails import: $(mark "$SEED")" >> $GITHUB_STEP_SUMMARY
          if [ "$MIGRATE" = "success" ] && [ "$VERIFY" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> The schema is deployed. The checks failed, so something about the database does not match what the tests expect — read the failing assertion before re-running." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema='public'" \
            | xargs -I{} echo "- Tables: {}" >> $GITHUB_STEP_SUMMARY
          psql "$DATABASE_URL" -tAc "select count(*) from pg_policies where schemaname='public'" \
            | xargs -I{} echo "- RLS policies: {}" >> $GITHUB_STEP_SUMMARY
          psql "$DATABASE_URL" -tAc "select coalesce(count(*),0) from sku_pricing" 2>/dev/null \
            | xargs -I{} echo "- Plans loaded: {}" >> $GITHUB_STEP_SUMMARY || true
