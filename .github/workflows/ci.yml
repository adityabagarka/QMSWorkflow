name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  database:
    name: Schema, RLS policies and guardrails import
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qms

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # ── PostgreSQL, on the runner rather than as a service container ──
      #
      # This job used to use a `postgres:15` service container and install
      # postgresql-15-pgtap on the runner. That could never have worked, and
      # apparently never did: `run-pgtap.ts` issues `create extension pgtap`,
      # which loads the extension on the SERVER, and the server was inside a
      # container that has no pgTAP in it. The package on the host was for a
      # PostgreSQL that nothing was connecting to.
      #
      # It stayed hidden because the apt step failed first — Ubuntu only ships
      # the pgTAP build matching its own default server, so when the hosted
      # runner moved to 24.04 (which defaults to PostgreSQL 16) the name
      # postgresql-15-pgtap stopped existing and the job went red on "Unable to
      # locate package" before ever reaching a test.
      #
      # Running the server on the runner puts the extension and the server in
      # the same filesystem, which is the whole requirement. 16 rather than 15
      # because that is what this runner image packages a matching pgTAP for;
      # the migrations are version-agnostic, and `Deploy to Supabase staging`
      # is what proves them against the version staging actually runs.
      - name: PostgreSQL with pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          sudo -u postgres createdb qms

      # Fail loudly here rather than 300 lines later with a confusing error if
      # the extension is not actually loadable.
      - name: Confirm pgTAP is available to the server
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d qms \
            -v ON_ERROR_STOP=1 -c "create extension pgtap" -c "drop extension pgtap"

      - run: npm run typecheck
      - run: npm run format:check

      # Connection-string parsing has its own regression suite: a `#` in a
      # Supabase-generated password broke the first staging deploy.
      - run: npm run test:parse

      # Every wizard step must have a page: the navigation and the routes are
      # separately correct and can disagree, which is a 404 nothing else catches.
      - run: npm run test:routes

      # Dates are India's, on machines that all run on GMT. Runs twice, once in
      # each zone, and requires the same answer from both.
      - run: npm run test:time

      # Cover start is derived as expiry plus one day, which is where off-by-one
      # bugs live — and a day out is a day of uninsured lives.
      - run: npm run test:cover-start

      # The spreadsheet parsers, against files shaped like the ones that
      # arrive: a title above the headers, lakh grouping, dd/mm/yyyy dates.
      - run: npm run test:parsing

      # Nobody is dropped from a roster, and loadings come out of the premium
      # rather than onto the claims. Both are easy to break later.
      - run: npm run test:members

      # The RFQ workbook, read back after writing: this is the file that
      # leaves the building and an insurer issues a policy from it.
      - run: npm run test:rfq
      - run: npm run test:extraction
      - run: npm run test:policy-facts
      - run: npm run test:policy-fill

      - name: Apply migrations
        run: npm run db:migrate

      # A schema change is tested against an empty database by everything
      # above and against the rows people actually created by this. 0028 added
      # a constraint refusing a GSTIN as a company name and failed the staging
      # deploy, because the first real deal is named 27AABCM1234N1Z5.
      - name: Migrations survive the data already there
        run: npm run test:migrations

      - name: Prove the role/span model (ARCHITECTURE.md §15)
        run: npm run db:test

      # The schema's constraints were never the problem when manual term entry
      # silently lost data — the sequence the app performs was. This runs that.
      - name: The terms grid write path
        run: npm run test:term-writes

      # Neither typecheck nor build can see inside a Supabase select: it is a
      # string, and the database it names is not there at compile time. A
      # column moved by a migration once emptied the whole terms grid.
      - name: Every column the app selects exists
        run: npm run test:page-queries

      - name: Import the guardrails workbook (ARCHITECTURE.md §4.3)
        run: npm run db:import-guardrails

      # Re-importing must be a no-op. A second run that changes row counts
      # would mean the upserts are not keyed correctly.
      - name: Re-import is idempotent
        run: npm run db:import-guardrails

  app:
    name: Application build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders. Real values are Vercel environment variables;
      # no credential belongs in this file (§16).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # The typeface each thing is set in, asserted rather than eyeballed —
      # including that a missing font variable degrades to the system sans
      # rather than taking the whole declaration with it and rendering the app
      # in Times. Needs a browser to read computed styles.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fonts
